<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buyzen Admin Panel</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f3f6f4;margin:0;color:#222}
header{background:#176b43;color:white;padding:18px}
main{max-width:900px;margin:20px auto;padding:12px}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:18px}
input,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:7px;font-size:16px}
button{background:#176b43;color:white;border:0;cursor:pointer}
button.delete{background:#b42318}
.hidden{display:none}
#message{white-space:pre-wrap;overflow-wrap:anywhere;padding:10px}
.product{border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0}
.product img{max-width:100%;height:150px;object-fit:contain}
</style>
</head>
<body>
<header><h2>Buyzen Admin Panel</h2></header>
<main>
<div class="card"><div id="message">Supabase সংযোগ হচ্ছে...</div></div>

<div class="card" id="loginBox">
<h3>Admin Login</h3>
<form id="loginForm">
<input id="email" type="email" placeholder="Admin Email" required>
<input id="password" type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
</div>

<div id="adminBox" class="hidden">
<div class="card">
<h3 id="formHeading">নতুন পণ্য যোগ করুন</h3>
<form id="productForm">
<input id="productId" type="hidden">
<input id="name" placeholder="পণ্যের নাম" required>
<input id="price" type="number" min="0" step="0.01" placeholder="দাম (টাকা)" required>
<input id="category" placeholder="ক্যাটাগরি" required>
<input id="stock" type="number" min="0" step="1" placeholder="স্টক সংখ্যা" required>
<textarea id="description" placeholder="পণ্যের বিবরণ"></textarea>
<label>পণ্যের ছবি</label>
<input id="imageFile" type="file" accept="image/*">
<label><input id="active" type="checkbox" checked style="width:auto"> ওয়েবসাইটে দেখাবে</label>
<button id="saveButton" type="submit">পণ্য সংরক্ষণ করুন</button>
<button id="cancelButton" type="button" class="hidden">সম্পাদনা বাতিল</button>
</form>
</div>

<div class="card">
<h3>পণ্যের তালিকা</h3>
<button id="refreshButton" type="button">তালিকা রিফ্রেশ</button>
<div id="productsList"></div>
<button id="logoutButton" type="button">Logout</button>
</div>
</div>
</main>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://hltvfckfbqegqsiimduw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MBxVwagR9WdW3M7m6Jrp8g_ckLRXnFq';
const ADMIN_EMAIL = 'bigvai311@gmail.com';
const BUCKET = 'product-images';

const $ = id => document.getElementById(id);
const say = text => $('message').textContent = text;

const db = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true }
});

let currentUser = null;

function showUser(user) {
  currentUser = user;
  const allowed = !!user && !!user.email &&
    user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();

  $('loginBox').classList.toggle('hidden', allowed);
  $('adminBox').classList.toggle('hidden', !allowed);
  return allowed;
}

async function uploadImage(file) {
  if (!file) return null;
  if (!file.type.startsWith('image/')) {
    throw new Error('শুধু ছবির ফাইল আপলোড করা যাবে।');
  }
  if (file.size > 5 * 1024 * 1024) {
    throw new Error('ছবির সাইজ ৫ MB-এর কম হতে হবে।');
  }

  const safeName = file.name.replace(/[^a-zA-Z0-9.-]/g, '');
  const path = currentUser.id + '/' + Date.now() + '-' + safeName;
  const { error } = await db.storage.from(BUCKET).upload(path, file, {
    contentType: file.type,
    upsert: false
  });
  if (error) throw error;

  return db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    const { data, error } = await db.auth.signInWithPassword({
      email: $('email').value.trim(),
      password: $('password').value
    });
    if (error) throw error;

    if (!showUser(data.user)) {
      await db.auth.signOut();
      throw new Error('এই ইমেইলটি Admin হিসেবে অনুমোদিত নয়।');
    }
    say('লগইন সফল।');
    await loadProducts();
  } catch (error) {
    say('লগইন হয়নি: ' + error.message);
  }
});

$('logoutButton').addEventListener('click', async () => {
  const { error } = await db.auth.signOut();
  if (error) say(error.message);
});

$('productForm').addEventListener('submit', async e => {
  e.preventDefault();

  if (!currentUser ||
      currentUser.email?.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
    say('প্রথমে Admin হিসেবে লগইন করুন।');
    return;
  }

  $('saveButton').disabled = true;
  say('পণ্য সংরক্ষণ হচ্ছে...');

  try {
    const id = $('productId').value;
    const product = {
      name: $('name').value.trim(),
      price: Number($('price').value),
      category: $('category').value.trim(),
      stock: Number($('stock').value),
      description: $('description').value.trim(),
      is_active: $('active').checked
    };

    const image = await uploadImage($('imageFile').files[0]);
    if (image) product.image_url = image;

    const result = id
      ? await db.from('products').update(product).eq('id', id)
      : await db.from('products').insert(product);

    if (result.error) throw result.error;

    $('productForm').reset();
    $('productId').value = '';
    $('formHeading').textContent = 'নতুন পণ্য যোগ করুন';
    $('saveButton').textContent = 'পণ্য সংরক্ষণ করুন';
    $('cancelButton').classList.add('hidden');
    $('active').checked = true;

    say('পণ্য সফলভাবে সংরক্ষিত হয়েছে।');
    await loadProducts();
  } catch (error) {
    say('পণ্য সংরক্ষণ হয়নি: ' + error.message);
  } finally {
    $('saveButton').disabled = false;
  }
});

$('cancelButton').addEventListener('click', () => {
  $('productForm').reset();
  $('productId').value = '';
  $('formHeading').textContent = 'নতুন পণ্য যোগ করুন';
  $('saveButton').textContent = 'পণ্য সংরক্ষণ করুন';
  $('cancelButton').classList.add('hidden');
  $('active').checked = true;
});

$('refreshButton').addEventListener('click', loadProducts);

async function loadProducts() {
  if (!currentUser) return;
  $('productsList').textContent = 'পণ্য লোড হচ্ছে...';

  const { data, error } = await db
    .from('products').select('*').order('id', { ascending: false });

  if (error) {
    $('productsList').textContent = 'পণ্য লোড হয়নি: ' + error.message;
    return;
  }

  $('productsList').replaceChildren();

  if (!data.length) {
    $('productsList').textContent = 'এখনো কোনো পণ্য নেই।';
    return;
  }

  data.forEach(p => {
    const box = document.createElement('div');
    box.className = 'product';

    if (p.image_url) {
      const img = document.createElement('img');
      img.src = p.image_url;
      img.alt = p.name || 'পণ্যের ছবি';
      box.append(img);
    }

    const title = document.createElement('h3');
    title.textContent = p.name;
    const info = document.createElement('p');
    info.textContent = 'দাম: ৳' + p.price + ' | স্টক: ' + p.stock;

    const edit = document.createElement('button');
    edit.textContent = 'সম্পাদনা';
    edit.onclick = () => {
      $('productId').value = p.id;
      $('name').value = p.name || '';
      $('price').value = p.price ?? 0;
      $('category').value = p.category || '';
      $('stock').value = p.stock ?? 0;
      $('description').value = p.description || '';
      $('active').checked = !!p.is_active;
      $('imageFile').value = '';
      $('formHeading').textContent = 'পণ্য সম্পাদনা';
      $('saveButton').textContent = 'পরিবর্তন সংরক্ষণ করুন';
      $('cancelButton').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    const del = document.createElement('button');
    del.textContent = 'পণ্য মুছুন';
    del.className = 'delete';
    del.onclick = async () => {
      if (!confirm('এই পণ্যটি মুছতে চান?')) return;
      const { error } = await db.from('products').delete().eq('id', p.id);
      if (error) say('মুছতে সমস্যা: ' + error.message);
      else {
        say('পণ্য মুছে ফেলা হয়েছে।');
        await loadProducts();
      }
    };

    box.append(title, info, edit, del);
    $('productsList').append(box);
  });
}

async function init() {
  try {
    const { data, error } = await db.auth.getSession();
    if (error) throw error;

    const user = data.session?.user || null;
    if (showUser(user)) {
      say('Admin লগইন আছে।');
      await loadProducts();
    } else {
      say('Admin ইমেইল ও পাসওয়ার্ড দিয়ে লগইন করুন।');
    }

    db.auth.onAuthStateChange((_event, session) => {
      const allowed = showUser(session?.user || null);
      if (allowed) loadProducts();
      else if (!session?.user) say('Admin ইমেইল ও পাসওয়ার্ড দিয়ে লগইন করুন।');
    });
  } catch (error) {
    say('Supabase সংযোগে সমস্যা: ' + error.message);
  }
}

init();
</script>
</body>
</html>
