<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buyzen Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7f0;color:#243b2b;font-family:Arial,sans-serif}
header{background:#176b3a;color:white;text-align:center;padding:20px}
main{max-width:720px;margin:22px auto;padding:14px}
.card{background:white;padding:20px;margin-bottom:18px;border-radius:14px;box-shadow:0 3px 14px #0001}
h2{margin-top:0}
label{display:block;margin-top:13px;font-weight:bold}
input,textarea,select,button{width:100%;padding:12px;margin-top:7px;border-radius:8px;font-size:16px}
input,textarea,select{border:1px solid #ccd5ca;background:white}
button{border:0;background:#176b3a;color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#52665a}
button.danger{background:#b42318}
.hidden{display:none}
.note{padding:12px;background:#fff4d6;border-radius:8px;line-height:1.5;overflow-wrap:anywhere}
.product{border:1px solid #ddd;border-radius:10px;padding:12px;margin-top:12px}
.product img{width:100%;max-height:220px;object-fit:contain;background:#f5f5f5}
#message{margin-top:12px;line-height:1.5;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h1>Buyzen Admin Panel</h1>
<p>আপনার অনলাইন দোকান পরিচালনা করুন</p>
</header>
<main>
<section class="card" id="loginCard">
<h2>Admin Login</h2>
<label for="email">ইমেইল</label>
<input id="email" type="email" placeholder="আপনার Admin ইমেইল" autocomplete="username" required>
<label for="password">পাসওয়ার্ড</label>
<input id="password" type="password" placeholder="Supabase Auth পাসওয়ার্ড" autocomplete="current-password" required>
<button id="loginBtn">লগইন করুন</button>
<p id="loginMessage"></p>
<p class="note">লগইন করতে Supabase Authentication-এ তৈরি Admin অ্যাকাউন্টের পাসওয়ার্ড ব্যবহার করুন।</p>
</section>

<section class="card hidden" id="adminCard">
<h2>নতুন পণ্য যোগ করুন</h2>
<p id="welcome"></p>
<button class="secondary" id="logoutBtn">লগআউট</button>

<form id="productForm">
<label for="name">পণ্যের নাম</label>
<input id="name" required placeholder="যেমন: খাঁটি আখের গুড়">

<label for="price">দাম (টাকা)</label>
<input id="price" type="number" min="1" step="0.01" required placeholder="200">

<label for="category">ক্যাটাগরি</label>
<select id="category" required>
<option value="">ক্যাটাগরি নির্বাচন করুন</option>
<option value="গুড়">গুড়</option>
<option value="মধু">মধু</option>
<option value="সরিষার তেল">সরিষার তেল</option>
<option value="কৃষিপণ্য">কৃষিপণ্য</option>
<option value="অন্যান্য">অন্যান্য</option>
</select>

<label for="description">পণ্যের বিবরণ</label>
<textarea id="description" rows="4" placeholder="পণ্যের বিবরণ লিখুন"></textarea>

<label for="stock">স্টকের পরিমাণ</label>
<input id="stock" type="number" min="0" value="10" required>

<label for="imageFile">পণ্যের ছবি আপলোড</label>
<input id="imageFile" type="file" accept="image/*">

<label for="imageUrl">অথবা ছবির লিংক</label>
<input id="imageUrl" type="url" placeholder="https://example.com/image.jpg">

<button id="saveBtn" type="submit">পণ্য সংরক্ষণ করুন</button>
</form>
<div id="message" role="status"></div>
</section>

<section class="card hidden" id="productsCard">
<h2>পণ্যের তালিকা</h2>
<button class="secondary" id="refreshBtn">তালিকা রিফ্রেশ করুন</button>
<div id="productsList"></div>
</section>
</main>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://hltvfckfbqegqsiimduw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MBxVwagR9WdW3M7m6Jrp8g_ckLRXnFq';
const ADMIN_EMAIL = 'bigvai311@gmail.com';
const BUCKET = 'product-images';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let currentUser = null;

function message(text, error=false) {
  $('message').textContent = text;
  $('message').style.color = error ? '#b42318' : '#176b3a';
}

function showLoggedIn(user) {
  currentUser = user;
  const allowed = user && user.email &&
    user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();

  $('loginCard').classList.toggle('hidden', !!allowed);
  $('adminCard').classList.toggle('hidden', !allowed);
  $('productsCard').classList.toggle('hidden', !allowed);

  if (!allowed) {
    $('loginCard').classList.remove('hidden');
    $('loginMessage').textContent = user
      ? 'এই ইমেইল Admin হিসেবে অনুমোদিত নয়।'
      : '';
    return;
  }

  $('welcome').textContent = 'লগইন হয়েছে: ' + user.email;
  loadProducts();
}

$('loginBtn').addEventListener('click', async () => {
  const email = $('email').value.trim();
  const password = $('password').value;

  if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
    $('loginMessage').textContent = 'Admin ইমেইলটি সঠিক নয়।';
    return;
  }
  if (!password) {
    $('loginMessage').textContent = 'পাসওয়ার্ড লিখুন।';
    return;
  }

  $('loginBtn').disabled = true;
  $('loginMessage').textContent = 'লগইন হচ্ছে...';

  const {data, error} = await supabase.auth.signInWithPassword({
    email, password
  });

  $('loginBtn').disabled = false;

  if (error) {
    $('loginMessage').textContent = 'লগইন হয়নি: ' + error.message;
    return;
  }

  showLoggedIn(data.user);
});

$('logoutBtn').addEventListener('click', async () => {
  await supabase.auth.signOut();
  currentUser = null;
  $('adminCard').classList.add('hidden');
  $('productsCard').classList.add('hidden');
  $('loginCard').classList.remove('hidden');
  $('loginMessage').textContent = 'লগআউট হয়েছে।';
});

async function uploadImage(file) {
  if (!file) return $('imageUrl').value.trim() || null;

  if (!file.type.startsWith('image/')) {
    throw new Error('শুধু ছবির ফাইল আপলোড করুন।');
  }
  if (file.size > 5 * 1024 * 1024) {
    throw new Error('ছবির আকার ৫ MB-এর কম হতে হবে।');
  }

  const safeName = file.name.replace(/[^a-zA-Z0-9.-]/g, '');
  const path = currentUser.id + '/' + Date.now() + '-' + safeName;

  const {error} = await supabase.storage.from(BUCKET)
    .upload(path, file, { upsert: false, contentType: file.type });

  if (error) throw error;

  const {data} = supabase.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

$('productForm').addEventListener('submit', async event => {
  event.preventDefault();

  if (!currentUser ||
      currentUser.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
    message('প্রথমে Admin হিসেবে লগইন করুন।', true);
    return;
  }

  $('saveBtn').disabled = true;
  message('পণ্য সংরক্ষণ হচ্ছে...');

  try {
    const image = await uploadImage($('imageFile').files[0]);

    const product = {
      name: $('name').value.trim(),
      description: $('description').value.trim(),
      price: Number($('price').value),
      category: $('category').value,
      stock: Number($('stock').value),
      is_active: true
    };

    if (image) product.image_url = image;

    const {error} = await supabase.from('products').insert(product);
    if (error) throw error;

    $('productForm').reset();
    message('পণ্য সফলভাবে সংরক্ষিত হয়েছে!');
    await loadProducts();
  } catch (error) {
    message('সংরক্ষণ হয়নি: ' + error.message, true);
  } finally {
    $('saveBtn').disabled = false;
  }
});

async function loadProducts() {
  if (!currentUser) return;

  $('productsList').textContent = 'পণ্য লোড হচ্ছে...';

  const {data, error} = await supabase.from('products')
    .select('*').order('name', {ascending: true});

  if (error) {
    $('productsList').textContent =
      'পণ্য লোড হয়নি: ' + error.message;
    return;
  }

  $('productsList').replaceChildren();

  if (!data.length) {
    $('productsList').textContent = 'এখনো কোনো পণ্য পাওয়া যায়নি।';
    return;
  }

  for (const p of data) {
    const box = document.createElement('div');
    box.className = 'product';

    const title = document.createElement('h3');
    title.textContent = p.name || 'নামহীন পণ্য';
    box.append(title);

    if (p.image_url || p.image) {
      const img = document.createElement('img');
      img.src = p.image_url || p.image;
      img.alt = p.name || 'পণ্যের ছবি';
      img.loading = 'lazy';
      box.append(img);
    }

    const details = document.createElement('p');
    details.textContent = 'দাম: ৳' + p.price +
      ' | ক্যাটাগরি: ' + (p.category || '-') +
      ' | স্টক: ' + (p.stock ?? 0);
    box.append(details);

    const desc = document.createElement('p');
    desc.textContent = p.description || '';
    box.append(desc);

    const btn = document.createElement('button');
    btn.className = 'danger';
    btn.textContent = 'পণ্য মুছুন';
    btn.addEventListener('click', async () => {
      if (!confirm('এই পণ্যটি মুছে ফেলতে চান?')) return;
      const {error} = await supabase.from('products')
        .delete().eq('id', p.id);
      if (error) {
        message('পণ্য মোছা যায়নি: ' + error.message, true);
      } else {
        message('পণ্য মুছে ফেলা হয়েছে।');
        await loadProducts();
      }
    });
    box.append(btn);
    $('productsList').append(box);
  }
}

$('refreshBtn').addEventListener('click', loadProducts);

const {data: {session}} = await supabase.auth.getSession();
showLoggedIn(session?.user || null);

supabase.auth.onAuthStateChange((_event, session) => {
  showLoggedIn(session?.user || null);
});
</script>
</body>
</html>
