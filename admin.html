<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buyzen Admin Panel</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f0;
      color: #243b2b;
    }
    header {
      background: #176b3a;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }
    main {
      max-width: 650px;
      margin: 24px auto;
      padding: 18px;
    }
    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 3px 14px #00000012;
    }
    h2 { margin-top: 0; }
    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
    }
    input, textarea, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border-radius: 8px;
      font-size: 16px;
    }
    input, textarea, select {
      border: 1px solid #ccd5ca;
      background: white;
    }
    button {
      border: 0;
      background: #176b3a;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .note {
      margin-top: 18px;
      padding: 12px;
      background: #fff4d6;
      border-radius: 8px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <h1>Buyzen Admin Panel</h1>
    <p>আপনার অনলাইন দোকান পরিচালনা করুন</p>
  </header>

  <main>
    <section class="card">
      <h2>নতুন পণ্য যোগ করুন</h2>

      <form id="productForm">
        <label for="name">পণ্যের নাম</label>
        <input id="name" type="text"
          placeholder="যেমন: খাঁটি আখের গুড়" required>

        <label for="price">দাম (টাকা)</label>
        <input id="price" type="number"
          min="1" placeholder="যেমন: 200" required>

        <label for="category">ক্যাটাগরি</label>
        <select id="category" required>
          <option value="">ক্যাটাগরি নির্বাচন করুন</option>
          <option value="গুড়">গুড়</option>
          <option value="মধু">মধু</option>
          <option value="সরিষার তেল">সরিষার তেল</option>
          <option value="অন্যান্য">অন্যান্য</option>
        </select>

        <label for="description">পণ্যের বিবরণ</label>
        <textarea id="description" rows="4"
          placeholder="পণ্যের বিবরণ লিখুন"></textarea>

        <label for="image">পণ্যের ছবির লিংক</label>
        <input id="image" type="url"
          placeholder="https://example.com/image.jpg">

        <button type="submit">পণ্য যোগ করুন</button>
      </form>

      <div class="note" id="message">
        এটি প্রাথমিক ডিজাইন। এখনো পণ্য Supabase-এ সংরক্ষিত হবে না।
        নিরাপদ লগইন ও ডেটাবেস সংযোগ পরের ধাপে যোগ করা হবে।
      </div>
    </section>
  </main>

  <script>
    document.getElementById("productForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();
        document.getElementById("message").textContent =
          "Admin Panel-এর ডিজাইন প্রস্তুত। ডেটাবেস সংযোগের পর পণ্য সংরক্ষণ চালু হবে।";
      });
  </script>
</body>
</html>
