<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#176b43">
<title>Buyzen Admin Dashboard</title>
<style>
:root{--green:#176b43;--green2:#218653;--bg:#f4f7f5;--ink:#1b2c22;--muted:#66756b;--line:#e2e9e4;--red:#b42318}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{background:#fff;padding:28px;border-radius:18px;width:min(100%,420px);box-shadow:0 10px 35px #163d2414}
.brand{font-weight:800;font-size:25px;color:var(--green)}.brand span{color:#d83222}
.muted{color:var(--muted);font-size:13px;line-height:1.6}
.field{display:block;width:100%;padding:12px;border:1px solid #ccd8cf;border-radius:9px;margin:7px 0 14px;background:#fff}
.btn{border:0;border-radius:9px;padding:11px 14px;background:var(--green);color:#fff;font-weight:700}.btn:hover{background:var(--green2)}
.btn.secondary{background:#e9f2ec;color:var(--green)}.btn.danger{background:var(--red)}.btn.light{background:#eef2ef;color:#24352a}.btn.small{padding:7px 10px;font-size:13px}
#loginMessage,#globalMessage{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.sidebar{background:#123d29;color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.sidebar .brand{color:#fff;padding:4px 10px 20px}.side-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#a8c9b4;padding:14px 10px 6px}
.nav{width:100%;display:flex;align-items:center;gap:10px;border:0;border-radius:9px;padding:11px 10px;background:transparent;color:#e5f1e8;text-align:left;margin:2px 0}
.nav:hover,.nav.active{background:#286548;color:#fff}.main{min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
.topbar h1{font-size:20px;margin:0}.content{padding:22px;max-width:1450px;margin:auto}
.notice{padding:12px 14px;background:#fff7df;border:1px solid #f2df9c;border-radius:10px;color:#76500b;margin-bottom:16px;font-size:13px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:16px;min-width:0}
.stat .label{font-size:13px;color:var(--muted)}.stat .number{font-size:27px;font-weight:800;margin-top:9px;overflow-wrap:anywhere}
.panel h2,.panel h3{margin:0 0 14px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}
th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{color:#607066;background:#f8faf8}
td select{padding:7px;border:1px solid #ccd8cf;border-radius:7px;max-width:150px}
.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#e8f4eb;color:#176b43;font-size:12px}.pill.off{background:#fff0ed;color:#a1261b}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.form-grid label{font-size:13px;color:#506055}.form-grid .full{grid-column:1/-1}
.product-row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.product-row img{width:62px;height:62px;object-fit:cover;border-radius:8px;background:#f2f4f2}.product-actions{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:22px;text-align:center;color:var(--muted)}textarea.field{min-height:90px;resize:vertical}hr{border:0;border-top:1px solid var(--line);margin:16px 0}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:static;height:auto;padding:12px}.sidebar .brand{padding:5px 8px 10px}.nav-list{display:flex;overflow:auto;gap:4px}.nav{white-space:nowrap;width:auto;flex:0 0 auto;padding:9px 11px}.side-label{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{position:static}.content{padding:14px}}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:8px}.stat,.panel{padding:13px}.stat .number{font-size:21px}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.topbar{padding:12px}.topbar h1{font-size:17px}.content{padding:10px}.product-row{grid-template-columns:48px minmax(0,1fr)}.product-row img{width:48px;height:48px}.product-actions{grid-column:1/-1}}
</style>
</head>
<body>
<div id="loginScreen" class="login-wrap">
  <form id="loginForm" class="login-card">
    <div class="brand">🌿 Buy<span>zen</span></div>
    <h2>Admin Login</h2>
    <p class="muted">শুধু অনুমোদিত অ্যাডমিন অ্যাকাউন্ট দিয়ে প্রবেশ করুন।</p>
    <label for="email">Admin Email</label>
    <input class="field" id="email" type="email" autocomplete="username" placeholder="Admin Email" required>
    <label for="password">Password</label>
    <input class="field" id="password" type="password" autocomplete="current-password" placeholder="Password" required>
    <button class="btn" style="width:100%" id="loginButton" type="submit">Login</button>
    <p id="loginMessage" class="muted" role="status"></p>
  </form>
</div>
<div id="app" class="layout hidden">
  <aside class="sidebar">
    <div class="brand">🌿 Buy<span>zen</span></div><div class="side-label">Overview</div>
    <div class="nav-list">
      <button class="nav active" data-page="dashboard">📊 Dashboard</button><button class="nav" data-page="orders">📦 Orders</button>
      <button class="nav" data-page="incomplete">🕒 Incomplete Orders</button><button class="nav" data-page="products">🛍️ Products</button>
      <button class="nav" data-page="categories">🗂️ Categories</button><button class="nav" data-page="reviews">⭐ Reviews</button>
      <button class="nav" data-page="banners">🖼️ Banners</button><button class="nav" data-page="pages">📄 Pages</button>
      <button class="nav" data-page="features">✨ Featured Products</button><button class="nav" data-page="logistics">🚚 Logistics & Tracking</button>
      <button class="nav" data-page="analytics">📈 Analytics</button><button class="nav" data-page="settings">⚙️ Settings & SEO</button>
    </div><hr style="border-color:#35674c"><button id="logoutButton" class="nav" type="button">↩ Logout</button>
  </aside>
  <section class="main">
    <header class="topbar"><h1 id="pageTitle">Dashboard</h1><a href="./" target="_blank" rel="noopener" style="color:#176b43;font-weight:bold;text-decoration:none">ওয়েবসাইট দেখুন ↗</a></header>
    <main class="content"><div id="globalMessage" class="notice hidden" role="status"></div><div id="pageContent"></div></main>
  </section>
</div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://hltvfckfbqegqsiimduw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_MBxVwagR9WdW3M7m6Jrp8g_ckLRXnFq';
const ADMIN_EMAIL = 'bigvai311@gmail.com';
const BUCKET = 'product-images';
const db = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
const $ = id => document.getElementById(id);
let currentUser = null, productsCache = [], ordersCache = [], activePage = 'dashboard';

const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = value => '৳' + Number(value || 0).toLocaleString('en-BD');
const dateText = value => value ? new Date(value).toLocaleString('en-BD') : '—';
function message(text) { const el = $('globalMessage'); el.textContent = text; el.classList.remove('hidden'); }
function clearMessage() { $('globalMessage').classList.add('hidden'); }

function setLoggedIn(user) {
  const allowed = !!user && String(user.email || '').toLowerCase() === ADMIN_EMAIL.toLowerCase();
  currentUser = allowed ? user : null;
  $('loginScreen').classList.toggle('hidden', allowed);
  $('app').classList.toggle('hidden', !allowed);
  return allowed;
}
function setPage(page) {
  activePage = page;
  document.querySelectorAll('.nav[data-page]').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  const titles = {dashboard:'Dashboard',orders:'Orders',incomplete:'Incomplete Orders',products:'Products',categories:'Categories',reviews:'Reviews',banners:'Banners',pages:'Pages',features:'Featured Products',logistics:'Logistics & Tracking',analytics:'Analytics',settings:'Settings & SEO'};
  $('pageTitle').textContent = titles[page] || 'Dashboard';
  renderPage();
}
async function loadData() {
  if (!currentUser) return;
  const [p, o] = await Promise.all([
    db.from('products').select('*').order('created_at', {ascending:false}),
    db.from('orders').select('*').order('created_at', {ascending:false})
  ]);
  if (p.error) message('পণ্য লোড হয়নি: ' + p.error.message); else productsCache = p.data || [];
  if (o.error) message('অর্ডার লোড হয়নি: ' + o.error.message); else ordersCache = o.data || [];
  renderPage();
}
function statCard(label, value, sub = '') {
  return `<div class="stat"><div class="label">${esc(label)}</div><div class="number">${esc(value)}</div><div class="muted">${esc(sub)}</div></div>`;
}
function orderItems(o) {
  if (Array.isArray(o.items)) return o.items.map(i => `${i.name || i.product_name || 'পণ্য'} × ${i.quantity || 1}`).join(', ');
  if (o.items && typeof o.items === 'object') return JSON.stringify(o.items);
  return String(o.items || '—');
}
function ordersTable(rows, allowActions = true) {
  if (!rows.length) return '<div class="empty">এখনো কোনো অর্ডার পাওয়া যায়নি।</div>';
  return `<div class="table-wrap"><table><thead><tr><th>অর্ডার</th><th>তারিখ</th><th>ক্রেতা</th><th>পণ্য</th><th>মোট</th><th>স্ট্যাটাস</th>${allowActions ? '<th>কাজ</th>' : ''}</tr></thead><tbody>${rows.map(o => `<tr>
  <td>#${esc(o.id)}</td><td>${esc(dateText(o.created_at))}</td><td><b>${esc(o.customer_name)}</b><br>${esc(o.phone)}<br><span class="muted">${esc(o.address)}</span></td><td>${esc(orderItems(o))}</td><td>${money(o.total_amount)}</td>
  <td>${allowActions ? `<select data-status-id="${esc(o.id)}">${['pending','confirmed','processing','shipped','delivered','cancelled'].map(s => `<option value="${s}" ${String(o.status || 'pending').toLowerCase() === s ? 'selected' : ''}>${s}</option>`).join('')}</select>` : `<span class="pill">${esc(o.status || 'pending')}</span>`}</td>
  ${allowActions ? `<td><button class="btn secondary small" data-detail-id="${esc(o.id)}" type="button">বিস্তারিত</button></td>` : ''}</tr>`).join('')}</tbody></table></div>`;
}
function dashboardPage() {
  const pending = ordersCache.filter(o => String(o.status || 'pending').toLowerCase() === 'pending').length;
  const revenue = ordersCache.filter(o => ['delivered','completed'].includes(String(o.status || '').toLowerCase())).reduce((s,o) => s + Number(o.total_amount || 0), 0);
  const today = new Date(); today.setHours(0,0,0,0);
  const todayOrders = ordersCache.filter(o => o.created_at && new Date(o.created_at) >= today).length;
  return `<div class="notice">ডেটাবেজে থাকা অর্ডার ও পণ্য এখানে দেখানো হবে। কোনো অর্ডার না দেখালে Supabase-এর orders টেবিলের Read (SELECT) অনুমতি পরীক্ষা করতে হবে।</div>
  <div class="grid">${statCard('মোট অর্ডার',ordersCache.length,'সব সংরক্ষিত অর্ডার')}${statCard('নতুন / Pending',pending,'যাচাই করা দরকার')}${statCard('আজকের অর্ডার',todayOrders,'আজ তৈরি হয়েছে')}${statCard('Delivered বিক্রি',money(revenue),'Delivered/Completed অর্ডার')}</div>
  <section class="panel"><div class="panel-head"><h2>সাম্প্রতিক অর্ডার</h2><button class="btn secondary small" data-action="page-orders" type="button">সব অর্ডার দেখুন</button></div>${ordersTable(ordersCache.slice(0,6),false)}</section>
  <section class="panel"><div class="panel-head"><h2>পণ্যের সারাংশ</h2><button class="btn secondary small" data-action="page-products" type="button">পণ্য পরিচালনা</button></div><p>মোট পণ্য: <b>${productsCache.length}</b> · সক্রিয়: <b>${productsCache.filter(p => p.is_active).length}</b> · স্টক শেষ: <b>${productsCache.filter(p => Number(p.stock) <= 0).length}</b></p></section>`;
}
function productForm(p = null) {
  return `<section class="panel"><h2>${p ? 'পণ্য সম্পাদনা' : 'নতুন পণ্য যোগ করুন'}</h2><form id="productForm" data-edit-id="${p ? esc(p.id) : ''}">
  <div class="form-grid">
  <label>পণ্যের নাম<input class="field" name="name" required value="${esc(p?.name || '')}"></label>
  <label>দাম (টাকা)<input class="field" name="price" type="number" min="0" step="0.01" required value="${esc(p?.price ?? '')}"></label>
  <label>ক্যাটাগরি<input class="field" name="category" required value="${esc(p?.category || '')}" list="categoryOptions"><datalist id="categoryOptions">${[...new Set(productsCache.map(x => x.category).filter(Boolean))].map(c => `<option value="${esc(c)}"></option>`).join('')}</datalist></label>
  <label>স্টক<input class="field" name="stock" type="number" min="0" step="1" required value="${esc(p?.stock ?? 0)}"></label>
  <label class="full">বিবরণ<textarea class="field" name="description">${esc(p?.description || '')}</textarea></label>
  <label class="full">ছবি (ঐচ্ছিক)<input class="field" name="image" type="file" accept="image/*"><span class="muted">সর্বোচ্চ ৫ MB। নতুন ছবি না দিলে আগের ছবিই থাকবে।</span></label>
  <label class="full"><input name="is_active" type="checkbox" ${p?.is_active === false ? '' : 'checked'} style="width:auto"> ওয়েবসাইটে দেখাবে</label>
  </div><button class="btn" type="submit">${p ? 'পরিবর্তন সংরক্ষণ' : 'পণ্য সংরক্ষণ'}</button> <button class="btn light" type="button" data-action="cancel-edit">বাতিল</button></form></section>`;
}
function productsPage() {
  return `${productForm()}<section class="panel"><div class="panel-head"><h2>পণ্যের তালিকা (${productsCache.length})</h2><button class="btn secondary small" data-action="refresh" type="button">রিফ্রেশ</button></div>${productsCache.length ? productsCache.map(p => `<div class="product-row">${p.image_url ? `<img src="${esc(p.image_url)}" alt="">` : '<div>🛍️</div>'}<div><b>${esc(p.name)}</b><div>${money(p.price)} · স্টক ${esc(p.stock)} · ${p.is_active ? '<span class="pill">সক্রিয়</span>' : '<span class="pill off">লুকানো</span>'}</div><div class="muted">${esc(p.category || 'ক্যাটাগরি নেই')}</div></div><div class="product-actions"><button class="btn secondary small" data-edit-product="${esc(p.id)}" type="button">এডিট</button><button class="btn danger small" data-delete-product="${esc(p.id)}" type="button">ডিলিট</button></div></div>`).join('') : '<div class="empty">এখনো পণ্য নেই।</div>'}</section>`;
}
function simplePage(page) {
  const notes = {
    categories:'Categories products টেবিলের category কলাম থেকে নেওয়া হয়। নতুন ক্যাটাগরি যোগ করতে পণ্য ফর্মে নাম ব্যবহার করুন।',
    reviews:'Reviews পরিচালনার জন্য আলাদা ডেটাবেজ টেবিল নিশ্চিত করা হয়নি।',
    banners:'এই সংস্করণে banner data সংরক্ষণের ব্যবস্থা নেই; এখানে পরিবর্তন করলে হোমপেজের banner বদলাবে না।',
    pages:'স্ট্যাটিক পেজ পরিবর্তনের জন্য আলাদা content-management ব্যবস্থা বা website code update দরকার।',
    features:'Featured পণ্যের আলাদা flag/field নেই। বর্তমানে সক্রিয় পণ্যগুলো দেখানো হচ্ছে।',
    logistics:'অর্ডারের status পরিবর্তন করে shipped/delivered চিহ্নিত করা যায়। কুরিয়ার API এখনো সংযুক্ত নয়।',
    analytics:'এখানে Supabase orders/products থেকে পাওয়া হিসাব দেখানো হচ্ছে।',
    settings:'এই সংস্করণে SEO ও Appearance পরিবর্তনের ফর্ম নেই; শুধু এই তথ্য জানানো হচ্ছে।'
  };
  if (page === 'categories') {
    const cats = [...new Set(productsCache.map(p => p.category).filter(Boolean))];
    return `<section class="panel"><h2>ক্যাটাগরি</h2><p class="muted">${esc(notes.categories)}</p>${cats.length ? cats.map(c => `<p>🗂️ ${esc(c)} <span class="muted">(${productsCache.filter(p => p.category === c).length} পণ্য)</span></p>`).join('') : '<div class="empty">ক্যাটাগরি নেই।</div>'}</section>`;
  }
  if (page === 'features') return `<section class="panel"><h2>Featured Products</h2><p class="muted">${esc(notes.features)}</p>${productsCache.filter(p => p.is_active).map(p => `<p>⭐ ${esc(p.name)} — ${money(p.price)}</p>`).join('') || '<div class="empty">সক্রিয় পণ্য নেই।</div>'}</section>`;
  if (page === 'logistics') return `<section class="panel"><h2>Logistics & Tracking</h2><p class="muted">${esc(notes.logistics)}</p>${ordersTable(ordersCache,true)}</section>`;
  if (page === 'analytics') return `<div class="grid">${statCard('মোট অর্ডার',ordersCache.length)}${statCard('মোট পণ্য',productsCache.length)}${statCard('সক্রিয় পণ্য',productsCache.filter(p => p.is_active).length)}${statCard('Delivered অর্ডার',ordersCache.filter(o => String(o.status).toLowerCase() === 'delivered').length)}</div><section class="panel"><h2>Analytics</h2><p class="muted">${esc(notes.analytics)}</p></section>`;
  const headings = {reviews:'Reviews',banners:'Banners',pages:'Pages',settings:'Settings & SEO'};
  return `<section class="panel"><h2>${esc(headings[page] || 'বিভাগ')}</h2><p class="muted">${esc(notes[page] || 'এই বিভাগটি পরে কনফিগার করা যাবে।')}</p></section>`;
}
function renderPage() {
  if (!currentUser) return;
  clearMessage();
  const root = $('pageContent');
  if (activePage === 'dashboard') root.innerHTML = dashboardPage();
  else if (activePage === 'orders') root.innerHTML = `<section class="panel"><div class="panel-head"><h2>সব অর্ডার (${ordersCache.length})</h2><button class="btn secondary small" data-action="refresh" type="button">রিফ্রেশ</button></div>${ordersTable(ordersCache,true)}</section>`;
  else if (activePage === 'incomplete') root.innerHTML = `<section class="panel"><h2>Incomplete Orders</h2><p class="muted">আলাদা incomplete/checkout field নিশ্চিত নয়; pending অর্ডারগুলো দেখানো হচ্ছে।</p>${ordersTable(ordersCache.filter(o => ['pending','incomplete','abandoned'].includes(String(o.status || 'pending').toLowerCase())),true)}</section>`;
  else if (activePage === 'products') root.innerHTML = productsPage();
  else root.innerHTML = simplePage(activePage);
}
async function uploadImage(file) {
  if (!file || !file.name) return null;
  if (!file.type.startsWith('image/')) throw new Error('শুধু ছবির ফাইল আপলোড করা যাবে।');
  if (file.size > 5 * 1024 * 1024) throw new Error('ছবির সাইজ ৫ MB-এর কম হতে হবে।');
  const safe = file.name.replace(/[^a-zA-Z0-9.-]/g,'') || 'product-image';
  const path = currentUser.id + '/' + Date.now() + '-' + safe;
  const {error} = await db.storage.from(BUCKET).upload(path,file,{contentType:file.type,upsert:false});
  if (error) throw error;
  return db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginButton').disabled = true;
  $('loginMessage').textContent = 'লগইন হচ্ছে...';
  try {
    const {data,error} = await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
    if (error) throw error;
    if (!setLoggedIn(data.user)) {
      await db.auth.signOut();
      throw new Error('এই ইমেইল Admin হিসেবে অনুমোদিত নয়।');
    }
    $('loginMessage').textContent = '';
    await loadData();
    setPage('dashboard');
  } catch (err) {
    $('loginMessage').textContent = 'লগইন হয়নি: ' + (err?.message || String(err));
  } finally {
    $('loginButton').disabled = false;
  }
});
$('logoutButton').addEventListener('click', async () => {
  await db.auth.signOut();
  setLoggedIn(null);
  $('loginMessage').textContent = 'আপনি লগআউট করেছেন।';
});
document.querySelectorAll('.nav[data-page]').forEach(b => b.addEventListener('click', () => setPage(b.dataset.page)));

$('pageContent').addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.action === 'page-orders') return setPage('orders');
  if (b.dataset.action === 'page-products') return setPage('products');
  if (b.dataset.action === 'refresh') { await loadData(); return; }
  if (b.dataset.action === 'cancel-edit') { renderPage(); return; }
  if (b.dataset.editProduct) {
    const p = productsCache.find(x => String(x.id) === b.dataset.editProduct);
    if (!p) return;
    const listMarker = '<section class="panel"><div class="panel-head"><h2>পণ্যের তালিকা';
    const currentHtml = $('pageContent').innerHTML;
    const listIndex = currentHtml.indexOf(listMarker);
    $('pageContent').innerHTML = productForm(p) + (listIndex >= 0 ? currentHtml.slice(listIndex) : '');
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  if (b.dataset.deleteProduct) {
    const p = productsCache.find(x => String(x.id) === b.dataset.deleteProduct);
    if (!p || !confirm(`"${p.name}" পণ্যটি ডিলিট করবেন?`)) return;
    const {error} = await db.from('products').delete().eq('id',p.id);
    if (error) message('পণ্য ডিলিট হয়নি: ' + error.message);
    else { message('পণ্য ডিলিট হয়েছে।'); await loadData(); }
    return;
  }
  if (b.dataset.detailId) {
    const o = ordersCache.find(x => String(x.id) === b.dataset.detailId);
    if (!o) return;
    alert(`অর্ডার #${o.id}\nতারিখ: ${dateText(o.created_at)}\nক্রেতা: ${o.customer_name || ''}\nফোন: ${o.phone || ''}\nঠিকানা: ${o.address || ''}\nপণ্য: ${orderItems(o)}\nমোট: ${money(o.total_amount)}\nস্ট্যাটাস: ${o.status || 'pending'}`);
  }
});
$('pageContent').addEventListener('change', async e => {
  const s = e.target.closest('select[data-status-id]');
  if (!s) return;
  s.disabled = true;
  const {error} = await db.from('orders').update({status:s.value}).eq('id',s.dataset.statusId);
  s.disabled = false;
  if (error) message('স্ট্যাটাস পরিবর্তন হয়নি: ' + error.message);
  else message('অর্ডারের স্ট্যাটাস আপডেট হয়েছে।');
  await loadData();
});
$('pageContent').addEventListener('submit', async e => {
  if (e.target.id !== 'productForm') return;
  e.preventDefault();
  const form = e.target, fd = new FormData(form), save = form.querySelector('button[type=submit]');
  save.disabled = true;
  try {
    const product = {
      name:String(fd.get('name') || '').trim(),
      price:Number(fd.get('price')),
      category:String(fd.get('category') || '').trim(),
      stock:Number(fd.get('stock')),
      description:String(fd.get('description') || '').trim(),
      is_active:fd.get('is_active') === 'on'
    };
    if (!product.name || !Number.isFinite(product.price) || product.price < 0 || !Number.isInteger(product.stock) || product.stock < 0) throw new Error('নাম, দাম ও স্টক সঠিকভাবে দিন।');
    const image = await uploadImage(fd.get('image'));
    if (image) product.image_url = image;
    const id = form.dataset.editId;
    const result = id ? await db.from('products').update(product).eq('id',id) : await db.from('products').insert(product);
    if (result.error) throw result.error;
    message(id ? 'পণ্য আপডেট হয়েছে।' : 'নতুন পণ্য যোগ হয়েছে।');
    await loadData();
    setPage('products');
  } catch (err) {
    message('পণ্য সংরক্ষণ হয়নি: ' + (err?.message || String(err)));
  } finally {
    save.disabled = false;
  }
});

async function init() {
  try {
    const {data,error} = await db.auth.getSession();
    if (error) throw error;
    if (setLoggedIn(data.session?.user || null)) {
      await loadData();
      setPage('dashboard');
    } else {
      $('loginMessage').textContent = 'Admin ইমেইল ও পাসওয়ার্ড দিয়ে লগইন করুন।';
    }
    db.auth.onAuthStateChange((_event,session) => {
      const allowed = setLoggedIn(session?.user || null);
      if (allowed) loadData();
    });
  } catch (err) {
    $('loginMessage').textContent = 'Supabase সংযোগে সমস্যা: ' + (err?.message || String(err));
  }
}
init();
</script>
